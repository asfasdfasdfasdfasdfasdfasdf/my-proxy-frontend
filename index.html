<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Proxy App</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #202225; font-family: sans-serif; }
    #container { display: flex; flex-direction: column; width: 100%; height: 100%; }
    #nav { padding: 10px; background: #2f3136; display: flex; gap: 10px; }
    input { flex: 1; padding: 8px; border: none; border-radius: 4px; background: #40444b; color: white; }
    button { padding: 8px 16px; border: none; border-radius: 4px; background: #5865f2; color: white; cursor: pointer; }
    iframe { flex: 1; border: none; width: 100%; height: 100%; background: white; }
  </style>
</head>
<body>
  <div id="container">
    <div id="nav">
      <input type="text" id="urlInput" value="https://discord.com">
      <button onclick="loadPage()">Go</button>
    </div>
    <!-- Removed 'allow-top-navigation' entirely to strip breakout mechanics -->
    <iframe id="proxyFrame" sandbox="allow-forms allow-modals allow-popups allow-scripts allow-same-origin"></iframe>
  </div>

  <script>
    // CORRECTED: Point this exactly to your live Render backend URL
    const BACKEND_URL = "https://my-proxy-backend-wj52.onrender.com";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(() => {
        console.log("Proxy Service Worker Registered");
      }).catch(err => console.error("SW Registration failed:", err));
    }

    function loadPage() {
      const targetUrl = document.getElementById("urlInput").value;
      const iframe = document.getElementById("proxyFrame");
      iframe.src = `${BACKEND_URL}/proxy?url=${encodeURIComponent(targetUrl)}`;
    }

    const iframe = document.getElementById("proxyFrame");
    iframe.addEventListener('load', () => {
      try {
        const frameWindow = iframe.contentWindow;

        // Override window.open inside the iframe so popups scale into the proxy frame
        frameWindow.open = function(url) {
          iframe.src = `${BACKEND_URL}/proxy?url=${encodeURIComponent(url)}`;
          return frameWindow;
        };

        // Click interceptor to bypass target="_blank" links forcing a breakout
        frameWindow.document.addEventListener('click', (e) => {
          const link = e.target.closest('a');
          if (link && link.href) {
            // If the link tries to target a new tab, force it into the proxy iframe
            if (link.target === '_blank' || link.target === '_parent' || link.target === '_top') {
              e.preventDefault();
              iframe.src = `${BACKEND_URL}/proxy?url=${encodeURIComponent(link.href)}`;
            }
          }
        }, true);

        // Trap form entries securely inside the frame execution stack
        frameWindow.document.addEventListener('submit', (e) => {
          const form = e.target;
          if (form.action && !form.action.startsWith(BACKEND_URL)) {
            e.preventDefault();
            const originalAction = form.action;
            form.action = `${BACKEND_URL}/proxy?url=${encodeURIComponent(originalAction)}`;
            form.submit();
          }
        }, true);

      } catch (err) {
        console.log("Cross-origin boundaries prevent direct script injection. Relying on Service Worker & Backend Rewriter.");
      }
    });
  </script>
</body>
</html>
