<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .topbar {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #222;
    }

    #url {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 6px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    #viewer {
      width: 100%;
      height: calc(100vh - 75px);
      border: none;
      background: white;
    }
  </style>
</head>

<body>

  <div class="topbar">

    <input
      id="url"
      type="text"
      placeholder="Enter a URL..."
      value="https://example.com"
    >

    <button onclick="openProxy()">
      Go
    </button>

  </div>

  <iframe
    id="viewer"
    src="about:blank"
  ></iframe>

  <script>
    const BACKEND = "https://my-proxy-backend-wj52.onrender.com";

    function openProxy() {
      let url = document.getElementById("url").value.trim();

      if (!url) {
        return;
      }

      // Automatically add HTTPS if the user didn't type a protocol.
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }

     document.getElementById("viewer").src = url;

    }

    document.getElementById("url").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        openProxy();
      }
    });
  </script>

</body>
</html>
